services:
  db:
    image: postgres:16-alpine
    container_name: alumni-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumni_db}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    image: alumni-api:prod
    build: ./backend
    container_name: alumni-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-alumni_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre defini}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      APP_STORAGE_PHOTOS_DIR: ${APP_STORAGE_PHOTOS_DIR:-/data/alumni/photos}
      APP_MAX_PHOTO_SIZE: ${APP_MAX_PHOTO_SIZE:-5MB}
    volumes:
      - profile_photos:/data/alumni/photos
    restart: unless-stopped

  web:
    image: alumni-frontend:prod
    build: ./frontend
    container_name: alumni-frontend
    ports:
      - "${PROD_WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  profile_photos:
