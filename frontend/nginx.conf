# Recherche accessible sans compte : on freine la collecte automatique par adresse IP.
limit_req_zone $binary_remote_addr zone=recherche_publique:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Envois jusqu’à 11 Mo (pièces jointes 10 Mo) ; en dessous, chaque service applique sa propre limite.
    client_max_body_size 11m;

    location = /api/public/annuaire {
        limit_req zone=recherche_publique burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    # Flux temps réel de la messagerie : pas de tampon, connexion longue (le serveur la ferme après 10 min).
    location = /api/messagerie/flux {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
