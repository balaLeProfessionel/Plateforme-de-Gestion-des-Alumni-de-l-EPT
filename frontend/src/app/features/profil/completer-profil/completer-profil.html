<div class="page-profil">
  <div class="contenu">

    <header class="entete">
      <h1>Complétez votre profil</h1>
      <p class="sous-titre">
        Renseignez ce que vous souhaitez maintenant : chaque section s'enregistre
        séparément, et vous pourrez revenir la compléter à tout moment.
      </p>
    </header>

    <app-infos-personnelles
      [profil]="profil()"
      [enSauvegarde]="enSauvegardeInfos()"
      [message]="messageInfos()"
      (sauvegarder)="enregistrerInfos($event)" />

    <app-liste-experiences
      [experiences]="experiences()"
      [brouillons]="brouillonsExperiences()"
      [suggestions]="suggestions()"
      [enRecherche]="enRechercheOrganisme()"
      [etat]="etatExperiences()"
      (ajouter)="ajouterBrouillonExperience()"
      (abandonnerBrouillon)="abandonnerBrouillonExperience($event)"
      (enregistrer)="enregistrerExperience($event)"
      (supprimer)="supprimerExperience($event)"
      (rechercherOrganisme)="rechercherOrganismes($event)" />

    <button type="button" class="btn-plus-tard" (click)="remplirPlusTard()">
      Remplir plus tard
    </button>

  </div>
</div>
