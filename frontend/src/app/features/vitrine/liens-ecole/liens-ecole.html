<ul aria-label="L’EPT en ligne">
  @for (lien of liens; track lien.nom) {
    <li>
      @if (lien.externe) {
        <a [href]="lien.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="lien.libelle" [title]="lien.nom">
          <i [class]="lien.icone" aria-hidden="true"></i>
        </a>
      } @else {
        <a [href]="lien.url" [attr.aria-label]="lien.libelle" [title]="lien.nom">
          <i [class]="lien.icone" aria-hidden="true"></i>
        </a>
      }
    </li>
  }
</ul>
