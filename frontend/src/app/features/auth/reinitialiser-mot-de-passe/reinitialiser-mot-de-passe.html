<main class="auth-page">
  <section class="carte" aria-labelledby="titre-reinitialisation">
    <div class="icone" aria-hidden="true"><i class="pi pi-key"></i></div>
    <h1 id="titre-reinitialisation">Nouveau mot de passe</h1>
    <p class="sous-titre">
      Saisissez le code envoyé à <strong>{{ email }}</strong>, puis choisissez votre nouveau mot de passe.
    </p>

    <div aria-live="polite">
      @if (messageErreur(); as texte) {
        <p class="alerte alerte-erreur" role="alert">{{ texte }}</p>
      }
    </div>

    <app-champ-formulaire #cCode="champ" pour="codeReinitialisation" libelle="Code à 6 chiffres" icone="pi-hashtag"
                          [obligatoire]="true" [erreur]="erreur('code')" aide="Valable 10 minutes. Pensez à vos spams.">
      <input id="codeReinitialisation" inputmode="numeric" autocomplete="one-time-code"
             [formField]="formulaire.code" placeholder="ex. 123456"
             [attr.aria-invalid]="erreur('code') ? 'true' : null" [attr.aria-describedby]="cCode.idMessage" />
    </app-champ-formulaire>

    <app-champ-formulaire #cMdp="champ" pour="nouveauMotDePasse" libelle="Nouveau mot de passe" icone="pi-lock"
                          [obligatoire]="true" [erreur]="erreur('nouveauMotDePasse')" aide="Au moins 8 caractères">
      <input id="nouveauMotDePasse" [type]="afficherNouveau() ? 'text' : 'password'" autocomplete="new-password"
             [formField]="formulaire.nouveauMotDePasse"
             [attr.aria-invalid]="erreur('nouveauMotDePasse') ? 'true' : null" [attr.aria-describedby]="cMdp.idMessage" />
      <button suffixe type="button" (click)="afficherNouveau.set(!afficherNouveau())"
              [attr.aria-label]="afficherNouveau() ? 'Masquer le nouveau mot de passe' : 'Afficher le nouveau mot de passe'"
              [attr.aria-pressed]="afficherNouveau()">
        <i class="pi" [class.pi-eye]="!afficherNouveau()" [class.pi-eye-slash]="afficherNouveau()" aria-hidden="true"></i>
      </button>
    </app-champ-formulaire>

    <app-champ-formulaire #cConf="champ" pour="confirmation" libelle="Confirmer le mot de passe" icone="pi-lock"
                          [obligatoire]="true" [erreur]="erreur('confirmation')">
      <input id="confirmation" [type]="afficherConfirmation() ? 'text' : 'password'" autocomplete="new-password"
             [formField]="formulaire.confirmation"
             [attr.aria-invalid]="erreur('confirmation') ? 'true' : null" [attr.aria-describedby]="cConf.idMessage"
             (keydown.enter)="reinitialiser()" />
      <button suffixe type="button" (click)="afficherConfirmation.set(!afficherConfirmation())"
              [attr.aria-label]="afficherConfirmation() ? 'Masquer la confirmation' : 'Afficher la confirmation'"
              [attr.aria-pressed]="afficherConfirmation()">
        <i class="pi" [class.pi-eye]="!afficherConfirmation()" [class.pi-eye-slash]="afficherConfirmation()" aria-hidden="true"></i>
      </button>
    </app-champ-formulaire>

    <button type="button" class="btn-ept" [disabled]="enChargement()"
            [attr.aria-busy]="enChargement()" (click)="reinitialiser()">
      {{ enChargement() ? 'Enregistrement…' : 'Enregistrer le mot de passe' }}
    </button>

    <a class="retour" routerLink="/mot-de-passe-oublie">Demander un nouveau code</a>
  </section>
</main>
