<main class="auth-page">
  <section class="carte" aria-labelledby="titre-mot-de-passe-oublie">
    <div class="icone" aria-hidden="true"><i class="pi pi-envelope"></i></div>
    <h1 id="titre-mot-de-passe-oublie">Mot de passe oublié</h1>
    <p class="sous-titre">
      Indiquez l’adresse email de votre compte. Vous recevrez un code valable 10 minutes.
    </p>

    <div aria-live="polite">
      @if (messageErreur(); as texte) {
        <p class="alerte alerte-erreur" role="alert">{{ texte }}</p>
      }
    </div>

    <app-champ-formulaire #cEmail="champ" pour="emailReinitialisation" libelle="Email" icone="pi-envelope"
                          [obligatoire]="true" [erreur]="erreurEmail()">
      <input id="emailReinitialisation" type="email" [formField]="formulaire.email" autocomplete="email"
             inputmode="email" placeholder="ex. vous@exemple.com"
             [attr.aria-invalid]="erreurEmail() ? 'true' : null" [attr.aria-describedby]="cEmail.idMessage"
             (keydown.enter)="envoyerCode()" />
    </app-champ-formulaire>

    <button type="button" class="btn-ept" [disabled]="enChargement()"
            [attr.aria-busy]="enChargement()" (click)="envoyerCode()">
      {{ enChargement() ? 'Envoi…' : 'Recevoir un code' }}
    </button>

    <a class="retour" routerLink="/connexion">Retour à la connexion</a>
  </section>
</main>
