spring.application.name=alumni-backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.profiles.default=dev

jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:2592000000}

app.storage.photos.dir=${APP_STORAGE_PHOTOS_DIR:./data/photos}
app.storage.photos.max-size=${APP_MAX_PHOTO_SIZE:5MB}
spring.servlet.multipart.max-file-size=${APP_MAX_PHOTO_SIZE:5MB}
spring.servlet.multipart.max-request-size=6MB
