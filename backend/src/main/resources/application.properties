spring.application.name=alumni-backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.profiles.default=dev

jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:2592000000}

app.storage.photos.dir=${APP_STORAGE_PHOTOS_DIR:./data/photos}
app.storage.photos.max-size=${APP_MAX_PHOTO_SIZE:5MB}
app.evenements.limite-creations-24h=${APP_EVENT_CREATION_LIMIT_24H:10}
app.publications.limite-creations-24h=${APP_PUBLICATION_CREATION_LIMIT_24H:10}
app.articles.limite-brouillons=${APP_ARTICLE_DRAFT_LIMIT:20}
app.premier-admin.email=${APP_PREMIER_ADMIN_EMAIL:}
app.premier-admin.mot-de-passe=${APP_PREMIER_ADMIN_PASSWORD:}
# Signataire de l'école sur la convention de stage générée (STA-05)
app.convention.directeur=${APP_CONVENTION_DIRECTEUR:Pr. Mamadou WADE}
app.convention.directeur-titre=${APP_CONVENTION_DIRECTEUR_TITRE:Directeur de l’École Polytechnique de Thiès}
# Plafond technique du multipart ; chaque usage garde sa propre limite (photos 5 Mo, pièces jointes 10 Mo).
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_SIZE:10MB}
# 31 Mo : l'import de CV accepte jusqu'à six images de 10 Mo au plus (30 Mo au total, contrôlé par le service).
spring.servlet.multipart.max-request-size=31MB
app.messagerie.piece-jointe.max-size=${APP_MAX_PIECE_JOINTE_SIZE:10MB}
# Offres d’emploi (#223) : durée de conservation des CV après la clôture ou l’expiration de l’offre — à faire valider par l’école.
app.emploi.conservation-cv-mois=${APP_EMPLOI_CONSERVATION_CV_MOIS:6}
app.messagerie.limite-envois-par-minute=${APP_MESSAGE_SEND_LIMIT_PER_MINUTE:30}

# Import de CV (pré-remplissage du profil par une IA)
# CV_IA_FOURNISSEUR : anthropic (Claude), openai (toute API compatible OpenAI : OpenAI, Mistral, Gemini, Ollama…),
# demo (profil fictif, sans IA) ou vide (import désactivé). Changer de modèle ou de fournisseur ne demande aucun code.
app.cv.fournisseur=${CV_IA_FOURNISSEUR:aucun}
# Le modèle choisi lit-il les images (photos, captures, PDF scannés) ?
app.cv.images=${CV_IA_IMAGES:true}
# Nom montré au membre dans le consentement (par défaut : « Anthropic (Claude) » ou « un service d'IA externe »)
app.cv.nom-fournisseur=${CV_IA_NOM_FOURNISSEUR:}
app.cv.limite-imports-24h=${CV_LIMITE_IMPORTS_24H:5}
app.cv.analyses-simultanees=${CV_ANALYSES_SIMULTANEES:2}
app.cv.conservation-brouillon=P7D
spring.ai.model.chat=${CV_IA_FOURNISSEUR:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.retry.max-attempts=3
# CV_IA_MODELE remplace le modèle par défaut du fournisseur ; vide, on garde celui ci-dessous.
app.cv.modele=${CV_IA_MODELE:}
spring.ai.anthropic.api-key=${CV_IA_CLE:}
spring.ai.anthropic.chat.options.model=claude-opus-5-5
spring.ai.anthropic.chat.options.max-tokens=8192
spring.ai.openai.api-key=${CV_IA_CLE:}
spring.ai.openai.base-url=${CV_IA_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=gpt-4o-mini
